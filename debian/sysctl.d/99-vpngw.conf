# vpngw kernel settings.
#
# The first line is the important one.

# Forwarding is OFF at boot, on purpose. vpngw raises it to 1 only after it has
# successfully loaded a complete ruleset. A boot where the daemon never starts -
# broken upgrade, corrupt database - therefore forwards nothing at all, on top
# of the firewall already denying it. Two independent reasons a client cannot
# reach the internet without a tunnel.
net.ipv4.ip_forward = 0

# IPv6 is not carried. A single rogue router advertisement from one client VM
# would otherwise give the whole segment a working v6 path that never enters
# the v4 policy routing, and every v6-capable site would silently bypass the
# tunnel. This is the most common leak in home-made VPN routers.
net.ipv6.conf.all.forwarding = 0
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0
net.ipv6.conf.default.disable_ipv6 = 1

# An ICMP redirect can install a route that bypasses the policy tables
# entirely, which would route around the kill switch without touching it.
#
# send_redirects needs conf.default as well, and the daemon clears it on each
# interface by name at startup. The kernel ORs this setting across all/<iface>
# instead of ANDing it, so conf.all = 0 alone leaves it on for every adapter
# that already exists - and a gateway that sends redirects hands clients a
# route straight past itself.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Loose reverse-path filtering. Strict mode (1) breaks the legitimately
# asymmetric paths that multiple per-tunnel routing tables create; loose mode
# (2) still discards packets whose source is unreachable by any route, which is
# what actually catches spoofing.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# ARP flux. By default a Linux host answers an ARP request for any of its
# addresses on any interface. A gateway with two adapters on the same segment
# then answers the same request twice with two different MACs, and the client's
# ARP cache flaps between them - half its traffic arrives on the wrong
# interface and the return path breaks. The symptom is an intermittent fault
# that looks like anything except ARP.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_announce = 2
net.ipv4.conf.all.proxy_arp = 0

# Ten-plus clients behind NAT with browsers open exhaust the default table
# faster than you would expect, and a full conntrack table drops new flows.
net.netfilter.nf_conntrack_max = 131072
net.nf_conntrack_max = 131072

# Routers see a lot of ARP.
net.ipv4.neigh.default.gc_thresh1 = 512
net.ipv4.neigh.default.gc_thresh2 = 2048
net.ipv4.neigh.default.gc_thresh3 = 4096
